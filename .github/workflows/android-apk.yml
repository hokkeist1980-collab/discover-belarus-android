name: Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - name: Embed JavaScript bundle in debug APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          old = 'debuggableVariants = ["debug"]'
          if old not in s:
              raise SystemExit("Could not find React Native debuggableVariants setting in android/app/build.gradle")
          p.write_text(s.replace(old, "debuggableVariants = []"))
          print("Configured debug variant to embed the JavaScript bundle.")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK with embedded JavaScript
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: discover-belarus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
